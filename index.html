<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ポートフォリオ</title>
<style>
  @font-face {
    font-family: "DotGothic16";
    src: url("./fonts/DotGothic16-Regular.ttf") format("truetype");
    font-display: swap;
  }
  :root {
    --bg: #0a0d29;
    --panel: #0d1132;
    --line: #2a2f5e;
    --fg: #ffffff;
    --dim: #a5add6;
    --accent: #6ad8f0;
    --sans: "DotGothic16", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Noto Sans JP", system-ui, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--fg); font-family: var(--sans); -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
  a { color: inherit; text-decoration: none; }
  svg, img, video { display: block; }
  svg { image-rendering: pixelated; }
  #app { min-height: 100dvh; }
  header { display: flex; align-items: baseline; flex-wrap: wrap; gap: 16px; padding: 16px 24px; border-bottom: 2px solid var(--line); }
  header .title { font-size: 32px; }
  header .lead { font-size: 14px; line-height: 1.6; color: var(--dim); }
  main { display: grid; grid-template-columns: 320px minmax(0, 1fr); align-items: start; }
  .catalog { min-width: 0; position: sticky; top: 0; border-right: 1px solid var(--line); }
  .catalog-label { padding: 20px 20px 8px; font-size: 14px; color: var(--dim); }
  .list { display: flex; flex-direction: column; gap: 8px; max-height: calc(100dvh - 58px); overflow-y: auto; padding: 8px 12px 20px; }
  .row { display: grid; grid-template-columns: 16px 32px minmax(0, 1fr); align-items: center; gap: 10px; padding: 12px 8px; min-height: 76px; flex-shrink: 0; border: 2px solid transparent; cursor: pointer; }
  .row .cursor { font-size: 16px; visibility: hidden; }
  .row.sel .cursor { visibility: visible; color: var(--accent); }
  .row .name { font-size: 16px; line-height: 1.6; overflow-wrap: anywhere; font-weight: 600; }
  .row .sub { font-size: 12px; line-height: 1.6; margin-top: 4px; color: var(--dim); }
  .row.sel { background: #1a1f4d; border-color: var(--accent); box-shadow: inset 3px 0 var(--accent); }
  .row:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .row:hover { background: #1a1f4d; }
  .detail { display: grid; width: 100%; max-width: 1040px; margin: 0 auto; padding: 24px 32px 40px; gap: 20px; min-width: 0; }
  .head { display: flex; align-items: center; flex-wrap: wrap; gap: 8px 12px; }
  .detail h1 { flex-basis: 100%; font-size: 28px; line-height: 1.5; font-weight: 700; overflow-wrap: anywhere; text-wrap: balance; }
  .tag, .meta { font-size: 13px; line-height: 1.6; color: var(--dim); }
  .tag { padding: 4px 12px; border: 1px solid var(--line); }
  .meta:empty { display: none; }
  .preview-wrap { display: flex; justify-content: center; min-width: 0; }
  /* 選択で画面が上下しない共通比率。映像全体はcontainで収める。 */
  .preview { position: relative; width: 100%; max-width: 760px; aspect-ratio: 16 / 9; overflow: hidden; background: #080b20; border: 2px solid var(--accent); box-shadow: 0 0 10px rgba(106,216,240,.3); }
  .preview > .stack { position: absolute; inset: 0; }
  .stack > * { position: absolute; inset: 0; width: 100%; height: 100%; display: none; }
  .stack > .on { display: block; }
  .stack svg, .stack img { width: 100%; height: 100%; }
  .preview video, .preview img { object-fit: contain; background: #080b20; }
  .preview.game video { image-rendering: pixelated; }
  .badge { position: absolute; right: 8px; bottom: 8px; z-index: 1; font-size: 12px; color: var(--dim); background: rgba(8,11,32,.75); padding: 3px 8px; }
  .desc { font-size: 16px; line-height: 1.9; color: #e6e9ff; overflow-wrap: anywhere; }
  .desc p + p { margin-top: 12px; }
  .actions { display: flex; flex-wrap: wrap; gap: 12px; }
  .btn { display: inline-flex; align-items: center; justify-content: center; min-height: 48px; padding: 12px 20px; border: 2px solid var(--line); color: var(--dim); font-size: 14px; font-weight: 600; }
  .btn:hover { border-color: var(--accent); color: var(--fg); }
  .btn.primary { border-color: var(--accent); color: var(--fg); box-shadow: 0 0 10px rgba(106,216,240,.25); }
  .btn.primary:hover { background: #1a1f4d; }
  .btn[aria-disabled="true"] { opacity: .4; cursor: default; }
  .btn:focus-visible, select:focus-visible, .step:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }
  .mobile-picker { display: none; }
  .browse { display: flex; align-items: center; justify-content: space-between; gap: 12px; color: var(--dim); font-size: 13px; }
  .browse-buttons { display: flex; gap: 8px; }
  .step { background: var(--panel); color: var(--fg); border: 1px solid var(--line); min-height: 44px; padding: 8px 16px; font: inherit; cursor: pointer; }
  .step:hover { border-color: var(--accent); }
  footer { display: flex; align-items: center; justify-content: center; flex-wrap: wrap; gap: 24px; padding: 12px; border-top: 2px solid var(--line); font-size: 12px; color: var(--dim); }
  footer .key { font-size: 16px; margin-right: 8px; }
  @media (max-width: 760px) {
    header { padding: 20px 16px 16px; gap: 8px; }
    header .title { font-size: 24px; }
    header .lead { width: 100%; font-size: 12px; }
    main { display: block; }
    .catalog { position: static; border: 0; padding: 16px 16px 0; }
    .catalog-label, .list { display: none; }
    .mobile-picker { display: grid; gap: 8px; }
    .mobile-picker label { font-size: 13px; color: var(--dim); }
    .mobile-picker select { width: 100%; min-width: 0; min-height: 48px; padding: 10px 8px; background: var(--panel); color: var(--fg); border: 1px solid var(--accent); font: 16px var(--sans); }
    .detail { padding: 16px 16px 32px; gap: 16px; }
    .detail h1 { font-size: 22px; }
    .desc { font-size: 15px; }
    .actions { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
    .btn { padding: 12px 8px; }
    .btn:only-child { grid-column: 1 / -1; }
    footer { display: none; }
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="title">ポートフォリオ</div>
    <div class="lead">つくったものを ならべています</div>
  </header>

  <main>
    <nav class="catalog" aria-label="作品を選ぶ">
      <div class="catalog-label">作品一覧</div>
      <div class="mobile-picker">
        <label for="product-select">作品を選ぶ</label>
        <select id="product-select"></select>
      </div>
      <div class="list" id="list" role="listbox" aria-label="プロダクト一覧"></div>
    </nav>
    <section class="detail" aria-labelledby="d-title">
      <div class="browse">
        <span id="position" aria-live="polite"></span>
        <div class="browse-buttons">
          <button class="step" id="previous" type="button" aria-label="前の作品">← 前へ</button>
          <button class="step" id="next" type="button" aria-label="次の作品">次へ →</button>
        </div>
      </div>
      <div class="head">
        <h1 id="d-title"></h1>
        <span class="tag" id="d-tag"></span>
        <span class="meta" id="d-by"></span>
      </div>
      <div class="preview-wrap">
        <div class="preview" id="d-preview">
          <span class="badge" id="d-badge"></span>
          <div class="stack" id="d-stack"></div>
        </div>
      </div>
      <div class="desc" id="d-desc"></div>
      <div class="actions" id="d-actions"></div>
    </section>
  </main>

  <footer>
    <span><span class="key">↑↓</span>えらぶ</span>
    <span>作品を選んで、ボタンからひらく</span>
  </footer>
</div>

<script>
  // ---------- ドット絵(SVG) ----------
  // festival-kiosk から持ってきたヘルパ。P=枠、R=1マス塗り。
  const P = (w, h, body) => `<svg viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg">${body}</svg>`;
  const R = (x, y, w, h, c) => `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${c}"/>`;

  const ICON_STG = P(16, 16,
    R(7,2,2,3,"#dff1ff") + R(6,5,4,3,"#7fc7ff") + R(5,8,6,3,"#3aa0ff") +
    R(3,10,10,3,"#2f6fd0") + R(2,12,3,2,"#1b4a9c") + R(11,12,3,2,"#1b4a9c") +
    R(6,13,4,2,"#ff9d3a") + R(7,15,2,1,"#ffdf6a"));
  const ICON_BK = P(16, 16,
    R(1,2,4,2,"#e2483d") + R(6,2,4,2,"#ef8f36") + R(11,2,4,2,"#e2c93a") +
    R(1,5,4,2,"#ef8f36") + R(6,5,4,2,"#e2c93a") + R(11,5,4,2,"#5ec46a") +
    R(7,9,2,2,"#ffffff") + R(4,13,8,2,"#4aa8ff"));
  const ICON_TW = P(16, 16,
    R(7,1,2,2,"#c9c9c9") + R(6,3,4,3,"#a9a9a9") + R(5,6,6,3,"#8f8f8f") +
    R(4,9,8,3,"#a9a9a9") + R(2,12,12,3,"#7d7d7d"));
  // 汎用アイコン（ゲーム以外のプロダクト用）
  const ICON_WEB = P(16, 16,
    R(1,2,14,12,"#2f6fd0") + R(1,2,14,3,"#4aa8ff") +
    R(2,3,1,1,"#dff1ff") + R(4,3,1,1,"#dff1ff") + R(6,3,1,1,"#dff1ff") +
    R(3,7,10,1,"#dff1ff") + R(3,9,8,1,"#9fb0ff") + R(3,11,6,1,"#9fb0ff"));
  const ICON_APP = P(16, 16,
    R(4,1,8,14,"#3a4180") + R(5,3,6,9,"#0a0d29") +
    R(6,5,4,1,"#5ec46a") + R(6,7,4,1,"#5ec46a") + R(6,9,2,1,"#5ec46a") +
    R(7,13,2,1,"#8f8f8f"));

  // プレビュー映像が無いときに同じ位置へ出す仮絵。
  const stars = Array.from({length:26}, (_,i) =>
    R((i*97)%250, (i*61)%230, 2, 2, i%3 ? "#4a5590" : "#9fb0ff")).join("");
  const SCENE_BLANK = P(256, 240,
    R(0,0,256,240,"#080b20") + stars +
    R(88,112,80,8,"#3a4180") + R(88,128,52,8,"#3a4180"));
  const SCENE_TOWER = P(256, 240,
    R(0,0,256,240,"#080b20") +
    Array.from({length:12}, (_,i) => R(0, i*20, 256, 10, "#10143a")).join("") +
    R(96,104,64,8,"#3a4180") + R(96,120,40,8,"#3a4180") + R(96,136,52,8,"#3a4180"));

  // ==========================================================================
  // ここを書き換えるだけで並びが変わる。
  //
  //   name     : プロダクト名（左リストと見出しに出る。ドット書体で出るので短く）
  //   sub      : 一行の添え書き
  //   tag      : 種類のラベル（"ゲーム" / "Webサイト" / "アプリ" など）
  //   by       : 誰が作ったか。⚠️ 分からないものは【要確認】のままにしておくこと
  //   icon     : 左リストのドット絵
  //   scene    : プレビューが読めなかったときの仮絵
  //   ratio    : 元素材の参考比率（表示枠はPC・スマホ共通で16:9）
  //   demo     : ループ再生する映像（webm/mp4）。無ければ省略
  //   poster   : 映像が無いときに出す静止画。無ければ scene が出る
  //   desc     : 説明文（空行で段落分け。単一改行は空白にして端末幅に合わせる）
  //   actions  : ボタン。primary:true が光るボタンになる。
  //              href が空文字なら「準備中」として押せない見た目になる
  // ==========================================================================
  const PRODUCTS = [
    {
      id: "stg", name: "シューティングゲーム", sub: "うちゅうを まもる", tag: "ゲーム",
      icon: ICON_STG, scene: SCENE_BLANK, ratio: "256 / 240",
      demo: "./demos/stg.webm",
      desc: "うちゅうから せめてくる てきを ビームで うちおとす、\nファミコン風の たてスクロール シューティング。\n\nGodot 4 で作り、そのまま ブラウザで あそべます。",
      actions: [
        { label: "ソースを見る", href: "https://github.com/medaka333/famicongame", primary: true }
      ]
    },
    {
      id: "breakout", name: "ブロックくずし", sub: "ボールを はねかえす", tag: "ゲーム",
      icon: ICON_BK, scene: SCENE_BLANK, ratio: "256 / 240",
      demo: "./demos/breakout.webm",
      desc: "ボールを はねかえして ブロックを ぜんぶ こわす。\nボスや アイテムの ある ステージ制。\n\n同じ ファミコン風の 見た目で そろえています。",
      actions: [
        { label: "ソースを見る", href: "https://github.com/medaka333/famicongame", primary: true }
      ]
    },
    {
      id: "human-stack-battle-20260715", name: "ともだちたわーばとる", sub: "つみあげて たたかう", tag: "ゲーム",
      by: "制作: 谷口",
      icon: ICON_TW, scene: SCENE_TOWER, ratio: "16 / 9",
      demo: "./demos/human-stack-battle-20260715.mp4",
      poster: "./previews/human-stack-battle-20260715.jpg",
      // ゲーム本体は自前ホストせず、既存の公開版にリンクする方針（2026-09-05 決定）
      desc: "とった しゃしんを きりぬいて、その かたちの まま つみあげる 物理ゲーム。\n1人用と、同じPCでの 2人対戦に 対応。\n\nTypeScript + Vite + matter-js。",
      actions: [
        { label: "▶ あそぶ", href: "https://human-stack-battle-game.pages.dev", primary: true },
        { label: "ソースを見る", href: "https://github.com/medaka333/animalVS" }
      ]
    },
    // --- ここから下は枠の見本。中身は未確定なので、実物に置き換えてください ---
    {
      id: "bird_hoken_app", name: "保険 営業支援アプリ", sub: "ヒアリングを AIで サポート", tag: "Webアプリ",
      by: "制作: kura-masa",
      icon: ICON_APP, scene: SCENE_BLANK, ratio: "16 / 9",
      demo: "./demos/bird_hoken_app.webm",
      desc: "保険の 営業さん向けの ヒアリング支援ツール。\nお客様の 状況を えらんでいくと、次に 聞くことを AIが 提案します。",
      actions: [
        { label: "サイトを見る", href: "https://birdhokenapp.vercel.app", primary: true },
        { label: "ソースを見る", href: "https://github.com/kura-masa/bird_hoken_app" }
      ]
    },
    {
      id: "ideas-knowledges-article", name: "Ideas & Knowledges", sub: "行動科学の 知見を 記事に", tag: "Webアプリ",
      by: "制作: kura-masa",
      icon: ICON_APP, scene: SCENE_BLANK, ratio: "16 / 9",
      demo: "./demos/IdeasAndKnowledgesArticle.webm",
      desc: "心理学や 行動科学の 研究を、日常で つかえる かたちに まとめた 記事サイト。",
      actions: [
        { label: "サイトを見る", href: "https://ideas-and-knowledges-article.vercel.app", primary: true },
        { label: "ソースを見る", href: "https://github.com/kura-masa/IdeasAndKnowledgesArticle" }
      ]
    },
    {
      id: "junpumaru", name: "漁業・出漁サポート", navName: "データベース整理", sub: "あなたのデータをみやすく", tag: "Webアプリ",
      by: "制作: kura-masa",
      icon: ICON_APP, scene: SCENE_BLANK, ratio: "16 / 9",
      demo: "./demos/junpumaru.mp4",
      poster: "./previews/junpumaru.jpg",
      desc: "漁師さん向けの 出漁サポート＆漁獲統計アプリ。\n波や 風の 予報を みながら、いつ 出るかを 判断できます。\n\n＊デモ動画なので 内容は 例に なります。\n\n非公開情報のため、サイトへのリンクは 非公開です。",
      actions: [
        { label: "サイトを見る", href: "", primary: true }
      ]
    },
    {
      id: "gijiro-winwinreco", name: "GIJIRO / WinWinReco", sub: "会議から 議事録・要約・ToDo", tag: "Webアプリ",
      icon: ICON_APP, scene: SCENE_BLANK, ratio: "16 / 9",
      demo: "./demos/gijiro-winwinreco.mp4",
      poster: "./previews/gijiro-winwinreco.jpg",
      desc: "会議の音声を文字に起こし、AIで議事録・要約・ToDoをまとめるアプリ。\n\n会議の作成にはアカウントが必要です。参加者はルームIDから参加できます。",
      actions: [
        { label: "サイトを見る", href: "https://winwinreco-227823039350.asia-northeast1.run.app/", primary: true },
        { label: "ソースを見る", href: "https://github.com/ninnzinn3bonn-creator/winwinreco" }
      ]
    },
    {
      id: "yururi-landing-page", name: "城崎 柳通り ゆるり", sub: "貸切宿の魅力を 写真と多言語で", tag: "Webサイト",
      icon: ICON_WEB, scene: SCENE_BLANK, ratio: "16 / 9",
      demo: "./demos/yururi-landing-page.mp4",
      poster: "./previews/yururi-landing-page.jpg",
      desc: "城崎の貸切宿「城崎 柳通り ゆるり」の紹介サイト。客室の写真、設備、周辺での過ごし方を案内します。\n\n日本語・英語・繁体字・韓国語に対応し、予約サイトへの案内も備えています。",
      actions: [
        { label: "サイトを見る", href: "https://yururi-landing-page.pages.dev/", primary: true }
      ]
    },
    {
      id: "local-project-register", name: "開発プロジェクト台帳", sub: "進捗と概念図を ひとつの台帳に", tag: "ローカルアプリ",
      icon: ICON_APP, scene: SCENE_BLANK, ratio: "16 / 9",
      demo: "./demos/local-project-register.mp4",
      poster: "./previews/local-project-register.jpg",
      desc: "複数プロジェクトの進捗、次の作業、課題、概念図をまとめて管理するアプリ。Web画面・CLI・Codexプラグインから利用できます。\n\nPCに導入して使うローカルアプリです。ブラウザで試せる公開版は未確認のため、導入方法をGitHubで案内しています。",
      actions: [
        { label: "GitHubで見る", href: "https://github.com/ninnzinn3bonn-creator/pj-", primary: true }
      ]
    }];

  // ---------- 画面の組み立て ----------
  let sel = 0;
  const $list = document.getElementById("list");
  const $stack = document.getElementById("d-stack");
  const $picker = document.getElementById("product-select");

  function buildList() {
    $picker.replaceChildren(...PRODUCTS.map((p, i) => new Option(p.navName || p.name, String(i))));
    $list.innerHTML = PRODUCTS.map((p, i) => `
      <div class="row" data-i="${i}" role="option" tabindex="-1" aria-selected="false">
        <div class="cursor">&gt;</div>
        <div class="art">${p.icon}</div>
        <div><div class="name">${p.navName || p.name}</div><div class="sub">${p.sub}</div></div>
      </div>`).join("");
  }

  // 映像は最初にまとめて用意して重ねておく。読めなければ仮絵に差し替える。
  function buildStack() {
    $stack.innerHTML = "";
    PRODUCTS.forEach((p, i) => {
      const fallback = () => {
        const d = document.createElement("div");
        d.dataset.i = i;
        d.innerHTML = p.poster
          ? `<img src="${p.poster}" alt="">`
          : p.scene;
        // poster の読み込みも失敗しうるので、そのときはドット絵まで落とす
        const img = d.querySelector("img");
        if (img) img.addEventListener("error", () => { d.innerHTML = p.scene; });
        $stack.replaceChild(d, $stack.children[i]);
        if (i === sel) d.classList.add("on");
      };
      if (!p.demo) {
        const d = document.createElement("div");
        d.dataset.i = i;
        d.innerHTML = p.poster ? `<img src="${p.poster}" alt="">` : p.scene;
        const img = d.querySelector("img");
        if (img) img.addEventListener("error", () => { d.innerHTML = p.scene; });
        $stack.appendChild(d);
        return;
      }
      const v = document.createElement("video");
      v.src = p.demo; v.muted = true; v.loop = true; v.autoplay = false;
      v.playsInline = true; v.preload = "metadata"; v.dataset.i = i;
      v.addEventListener("error", fallback);
      $stack.appendChild(v);
    });
  }

  function render() {
    const p = PRODUCTS[sel];

    document.querySelectorAll("#list .row").forEach((el, i) => {
      const on = i === sel;
      el.classList.toggle("sel", on);
      el.setAttribute("aria-selected", String(on));
      el.tabIndex = on ? 0 : -1;
    });

    document.getElementById("d-title").textContent = p.name;
    document.getElementById("d-tag").textContent = p.tag || "";
    document.getElementById("d-by").textContent = p.by || "";
    const paragraphs = (p.desc || "").split(/\n\s*\n/).map(text => {
      const paragraph = document.createElement("p");
      paragraph.textContent = text.replace(/\n/g, " ");
      return paragraph;
    });
    document.getElementById("d-desc").replaceChildren(...paragraphs);
    $picker.value = String(sel);
    document.getElementById("position").textContent = `${String(sel + 1).padStart(2, "0")} / ${PRODUCTS.length} 作品`;
    document.getElementById("d-preview").classList.toggle("game", p.tag === "ゲーム");
    document.getElementById("d-badge").textContent = p.demo ? "デモ" : "プレビュー";

    [...$stack.children].forEach((el, i) => {
      const on = i === sel;
      el.classList.toggle("on", on);
      // 隠れているあいだブラウザが再生を間引くことがあるので、出すときに必ず起こす
      if (el.tagName === "VIDEO") {
        if (on) el.play().catch(() => {});
        else el.pause();
      }
    });

    document.getElementById("d-actions").innerHTML = (p.actions || []).map((a) => {
      const cls = "btn" + (a.primary ? " primary" : "");
      return a.href
        ? `<a class="${cls}" href="${a.href}">${a.label}</a>`
        : `<span class="${cls}" aria-disabled="true">${a.label}</span>`;
    }).join("");
  }

  function selectProduct(index) {
    sel = (index + PRODUCTS.length) % PRODUCTS.length;
    render();
  }

  function move(delta, focusList = false) {
    selectProduct(sel + delta);
    if (focusList) {
      const row = $list.querySelectorAll(".row")[sel];
      row.focus({ preventScroll: true });
      row.scrollIntoView({ block: "nearest" });
    }
  }

  // PCもタッチも「選択→内容を確認→リンクで開く」に統一する。
  buildList();
  buildStack();
  render();

  $picker.addEventListener("change", () => selectProduct(Number($picker.value)));
  document.getElementById("previous").addEventListener("click", () => move(-1));
  document.getElementById("next").addEventListener("click", () => move(1));
  $list.addEventListener("click", (e) => {
    const row = e.target.closest(".row");
    if (row) selectProduct(Number(row.dataset.i));
  });
  $list.addEventListener("keydown", (e) => {
    if (e.altKey || e.ctrlKey || e.metaKey) return;
    const delta = { ArrowDown: 1, ArrowRight: 1, ArrowUp: -1, ArrowLeft: -1 }[e.key];
    if (delta) { e.preventDefault(); move(delta, true); }
    else if (e.key === "Home" || e.key === "End") {
      e.preventDefault();
      selectProduct(e.key === "Home" ? 0 : PRODUCTS.length - 1);
      $list.querySelectorAll(".row")[sel].focus();
    } else if (e.key === "Enter" || e.key === " ") {
      e.preventDefault();
      selectProduct(Number(e.target.closest(".row").dataset.i));
    }
  });
</script>
</body>
</html>
